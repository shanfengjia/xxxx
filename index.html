<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>烟雨西湖水墨绘 | 首页</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: "STSong", "宋体", serif;
}

body {
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  /* 匹配画板西湖渐变底色，风格统一 */
  background: linear-gradient(#edf6f4,#dce9e5);
  color: #3f4b47;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  position: relative;
}

/* 宣纸纹理底纹，替换失效外链，本地生效 */
body::after {
  content: "";
  position: fixed;
  inset: 0;
  background-color: rgba(250, 248, 242, 0.35);
  pointer-events: none;
  z-index: 1;
}

/* 水墨浮动粒子背景 */
.ink-bg {
  position: fixed;
  inset: 0;
  z-index: 2;
  pointer-events: none;
}

/* 首页主体内容 */
.home-box {
  position: relative;
  z-index: 3;
  text-align: center;
  animation: float 6s ease-in-out infinite;
}

@keyframes float {
  0%,100% { transform: translateY(0); opacity: 0.9; }
  50% { transform: translateY(-8px); opacity: 1; }
}

.home-title {
  font-size: 62px;
  letter-spacing: 12px;
  font-weight: bold;
  margin-bottom: 20px;
  color: #3f4b47;
  text-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.home-desc {
  font-size: 20px;
  letter-spacing: 4px;
  color: #60706b;
  margin-bottom: 50px;
}

/* 国风主按钮 */
.start-btn {
  padding: 16px 52px;
  font-size: 18px;
  letter-spacing: 4px;
  background: #6d817b;
  color: #fff;
  border: none;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.3s ease;
  box-shadow: 0 4px 15px rgba(109, 129, 123, 0.25);
}

.start-btn:hover {
  background: #4f6a63;
  transform: translateY(-3px);
  box-shadow: 0 8px 25px rgba(109, 129, 123, 0.35);
}

/* 底部落款 */
.footer-text {
  position: absolute;
  bottom: 30px;
  font-size: 14px;
  color: #7b8f89;
  letter-spacing: 2px;
  z-index: 3;
}

/* 移动端适配 */
@media (max-width: 768px) {
  .home-title {
    font-size: 38px;
    letter-spacing: 6px;
  }
  .home-desc {
    font-size: 16px;
  }
  .start-btn {
    padding: 14px 40px;
    font-size: 16px;
  }
}
</style>
</head>
<body>
<canvas class="ink-bg" id="bgCanvas"></canvas>

<div class="home-box">
  <h1 class="home-title">烟雨西湖水墨绘</h1>
  <p class="home-desc">一笔落烟雨，水墨绘西湖</p>
  <button class="start-btn" onclick="location.href='draw.html'">进入画板创作</button>
</div>

<div class="footer-text">国风手绘 · 西湖水墨专属画板</div>

<script>
// 水墨云雾动态背景
const bgCanvas = document.getElementById("bgCanvas");
const bgCtx = bgCanvas.getContext("2d");
let w, h;

function resize() {
  w = bgCanvas.width = window.innerWidth;
  h = bgCanvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

// 水墨粒子效果
class InkParticle {
  constructor(){
    this.x = Math.random() * w;
    this.y = Math.random() * h;
    this.r = Math.random() * 80 + 40;
    this.a = Math.random() * 0.03 + 0.008;
    this.speedX = (Math.random() - 0.5) * 0.12;
    this.speedY = (Math.random() - 0.5) * 0.12;
  }
  update(){
    this.x += this.speedX;
    this.y += this.speedY;
    if(this.x > w + 100) this.x = -100;
    if(this.x < -100) this.x = w + 100;
    if(this.y > h + 100) this.y = -100;
    if(this.y < -100) this.y = h + 100;
  }
  draw(){
    bgCtx.beginPath();
    bgCtx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
    bgCtx.fillStyle = `rgba(180, 195, 190, ${this.a})`;
    bgCtx.fill();
  }
}

let particles = [];
for(let i = 0; i < 15; i++) particles.push(new InkParticle());

function animate() {
  bgCtx.clearRect(0, 0, w, h);
  particles.forEach(item => {
    item.update();
    item.draw();
  })
  requestAnimationFrame(animate);
}
animate();
</script>
</body>
</html>
