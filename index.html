<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>烟雨西湖水墨绘</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"STSong","宋体";
}
body{
height:100vh;
background:linear-gradient(#edf6f4,#dce9e5);
overflow:hidden;
}
.container{
display:grid;
grid-template-columns:140px 1fr 170px;
grid-template-rows:60px 1fr 55px;
height:100vh;
}
.header{
grid-column:1/4;
background:rgba(255,255,255,.55);
border-bottom:1px solid #999;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 30px;
backdrop-filter:blur(8px);
}
.title{
font-size:30px;
color:#3f4b47;
font-weight:bold;
letter-spacing:4px;
}
.topButton{
display:flex;
gap:12px;
}
.topButton button{
padding:10px 20px;
border:none;
border-radius:10px;
background:#7b8f89;
color:white;
cursor:pointer;
font-size:15px;
}
.topButton button:hover{
background:#5d726c;
}
.left{
background:rgba(255,255,255,.45);
border-right:1px solid #aaa;
display:flex;
flex-direction:column;
align-items:center;
padding-top:20px;
gap:18px;
}
.tool{
width:95px;
height:42px;
border-radius:30px;
border:none;
background:#6e807a;
color:white;
cursor:pointer;
}
.tool.active{
background:#4f6a63;
box-shadow:inset 0 0 6px rgba(0,0,0,0.3);
}
.tool:hover{
background:#546661;
}
.slider{
width:90px;
}
.colorBox{
display:grid;
grid-template-columns:repeat(3,30px);
gap:10px;
}
.color{
width:30px;
height:30px;
border-radius:50%;
cursor:pointer;
border:2px solid white;
transition:0.2s;
}
.color:hover{
transform:scale(1.1);
}
.customColor{
width:95px;
height:34px;
border:none;
border-radius:6px;
cursor:pointer;
}
.center{
display:flex;
justify-content:center;
align-items:center;
background:url('https://www.transparenttextures.com/patterns/rice-paper.png');
}
.paper{
background:#faf8f2;
padding:20px;
box-shadow:0 0 25px rgba(0,0,0,.25);
border-radius:8px;
}
canvas{
background:#fbfaf5;
cursor:crosshair;
}
.right{
background:rgba(255,255,255,.45);
border-left:1px solid #aaa;
padding:15px;
overflow:auto;
}
.right h3{
text-align:center;
margin-bottom:15px;
}
.sticker{
height:90px;
background:#fff;
border:1px solid #bbb;
margin-bottom:12px;
border-radius:8px;
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
transition:.3s;
}
.sticker:hover{
transform:scale(1.04);
}
.footer{
grid-column:1/4;
background:rgba(255,255,255,.55);
border-top:1px solid #999;
display:flex;
justify-content:center;
align-items:center;
gap:18px;
}
.footer button{
padding:12px 24px;
border:none;
border-radius:10px;
cursor:pointer;
background:#6d817b;
color:white;
font-size:15px;
}
.export{
font-size:18px!important;
background:#4f6a63!important;
}
</style>
</head>
<body>
<div class="container">
<div class="header">
<div class="title">
烟雨西湖水墨绘
</div>
<div class="topButton">
<button onclick="alert('页面2：西湖底纹弹窗')">
切换底纹
</button>
<button onclick="alert('页面3：素材弹窗')">
贴纸素材
</button>
</div>
</div>
<div class="left">
<button class="tool active" id="brushBtn">
水墨画笔
</button>
<button class="tool" id="eraserBtn">
橡皮擦
</button>
<input class="slider"
type="range"
min="2"
max="30"
value="5"
id="size">
<div class="colorBox">
<div class="color" style="background:#111" onclick="changeColor('#111')"></div>
<div class="color" style="background:#666" onclick="changeColor('#666')"></div>
<div class="color" style="background:#7f5539" onclick="changeColor('#7f5539')"></div>
<div class="color" style="background:#55738d" onclick="changeColor('#55738d')"></div>
<div class="color" style="background:#3b705c" onclick="changeColor('#3b705c')"></div>
<div class="color" style="background:#a86464" onclick="changeColor('#a86464')"></div>
</div>
<input type="color" class="customColor" id="customColorInput" value="#111">
<button class="tool" onclick="clearCanvas()">
清空
</button>
</div>
<div class="center">
<div class="paper">
<canvas id="canvas" width="980" height="620"></canvas>
</div>
</div>
<div class="right">
<h3>西湖贴纸素材库</h3>
<div class="sticker">拱桥</div>
<div class="sticker">荷花</div>
<div class="sticker">游船</div>
<div class="sticker">亭台</div>
<div class="sticker">垂柳</div>
</div>
<div class="footer">
<button onclick="undo()">撤销</button>
<button class="export" onclick="alert('页面4：导出窗口')">导出作品</button>
<button onclick="redo()">恢复</button>
</div>
</div>
<script>
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");
const brushBtn=document.getElementById("brushBtn");
const eraserBtn=document.getElementById("eraserBtn");
const customColorInput=document.getElementById("customColorInput");
let drawing=false;
let color="#111";
let size=5;
let isEraser=false;
let history=[];
let step=-1;

document.getElementById("size").oninput=function(){
size=this.value;
}

customColorInput.oninput=function(){
color=this.value;
isEraser=false;
switchTool(false);
}

function changeColor(c){
color=c;
customColorInput.value=c;
isEraser=false;
switchTool(false);
}

function switchTool(eraserMode){
isEraser=eraserMode;
if(eraserMode){
brushBtn.classList.remove("active");
eraserBtn.classList.add("active");
}else{
brushBtn.classList.add("active");
eraserBtn.classList.remove("active");
}
}

brushBtn.onclick=()=>switchTool(false);
eraserBtn.onclick=()=>switchTool(true);

canvas.onmousedown=function(e){
drawing=true;
ctx.beginPath();
ctx.moveTo(e.offsetX,e.offsetY);
save();
}

canvas.onmousemove=function(e){
if(!drawing)return;
ctx.lineWidth=size;
ctx.lineCap="round";
ctx.lineJoin="round";
if(isEraser){
ctx.globalCompositeOperation="destination-out";
ctx.strokeStyle="rgba(255,255,255,1)";
}else{
ctx.globalCompositeOperation="source-over";
ctx.strokeStyle=color;
}
ctx.lineTo(e.offsetX,e.offsetY);
ctx.stroke();
}

window.onmouseup=function(){
drawing=false;
}

function save(){
step++;
history.length=step;
history.push(canvas.toDataURL());
}

function undo(){
if(step<=0)return;
step--;
let img=new Image();
img.src=history[step];
img.onload=()=>{
ctx.clearRect(0,0,canvas.width,canvas.height);
ctx.drawImage(img,0,0);
}
}

function redo(){
if(step>=history.length-1)return;
step++;
let img=new Image();
img.src=history[step];
img.onload=()=>{
ctx.clearRect(0,0,canvas.width,canvas.height);
ctx.drawImage(img,0,0);
}
}

function clearCanvas(){
ctx.clearRect(0,0,canvas.width,canvas.height);
save();
}
save();
</script>
</body>
</html>
